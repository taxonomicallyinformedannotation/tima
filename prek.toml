# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

ci = { autoupdate_schedule = "monthly" }

[[repos]]
repo = "https://github.com/posit-dev/air-pre-commit"
rev = "0.13.0"
hooks = [{ id = "air-format" }]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=200"] },
  { id = "file-contents-sorter", files = '^\.Rbuildignore$' },
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-xml" },
  { id = "check-yaml" },
  { id = "mixed-line-ending" },
  { id = "end-of-file-fixer", exclude = '\.Rd$' },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.10.0"
hooks = [{ id = "tombi-format" }, { id = "tombi-lint" }]

[[repos]]
repo = "https://github.com/jolars/panache-pre-commit"
rev = "v3.17.2"
hooks = [{ id = "panache-format" }, { id = "panache-lint" }]

[[repos]]
repo = "https://github.com/etiennebacher/jarl-pre-commit"
rev = "1.0.0"
hooks = [{ id = "jarl-check" }]

[[repos]]
repo = "local"
hooks = [
  { id = "parsable-r", name = "Check R files parse", entry = "Rscript", args = ["--vanilla", "-e", "for (f in commandArgs(trailingOnly = TRUE)) parse(file = f, encoding = 'UTF-8')"], language = "system", files = '\.[rR]$', pass_filenames = true },
  { id = "no-debug-calls", name = "Forbid browser/debug/debugonce calls", entry = '^\s*(browser|debug|debugonce)\s*\(', language = "pygrep", files = '^(R|inst)/.*\.[rR]$' },
  { id = "valid-description", name = "Check DESCRIPTION validity", entry = "Rscript", args = ["--vanilla", "-e", "d <- read.dcf('DESCRIPTION'); req <- c('Package', 'Version', 'Title', 'Description', 'License'); stopifnot(nrow(d) == 1L, all(req %in% colnames(d)), all(nzchar(trimws(d[1L, req]))))"], language = "system", files = "^DESCRIPTION$", pass_filenames = false },
  { id = "readme-synced", name = "Check README.md is not older than README.qmd", entry = "python3", args = ["-c", "import os, sys; sys.exit(1 if os.path.getmtime('README.md') + 1 < os.path.getmtime('README.qmd') else 0)"], language = "system", files = '^README\.(qmd|md)$', pass_filenames = false },
  { id = "ruff-check", name = "Lint Python files with ruff", entry = "ruff", args = ["check"], language = "system", files = '\.py$', pass_filenames = true },
  { id = "forbid-r-artifacts", name = "Don't commit R workspace files", entry = "Cannot commit .Rhistory, .RData, .Rds or .rds.", language = "fail", files = '\.(Rhistory|RData|Rds|rds)$', exclude = '^inst/extdata/.*\.rds$' },
]
